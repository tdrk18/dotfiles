[tasks."cask-migration:status"]
description = "Homebrew で入れた cask の mise への移行状況を表示する"
run = '''
config="${MISE_GLOBAL_CONFIG_FILE:-$HOME/.config/mise/config.toml}"
caskroom=/opt/homebrew/Caskroom

# Homebrew の記録（INSTALL_RECEIPT.json）があるものはまだ Homebrew 管理
brew_tokens=""
for token in $(sed -nE 's/^"brew-cask:([^"]+)".*/\1/p' "$config"); do
    name=${token##*/}
    if [ -f "$caskroom/$name/.metadata/INSTALL_RECEIPT.json" ]; then
        brew_tokens="$brew_tokens $token"
    elif [ -d "$caskroom/$name" ]; then
        echo "done	$token"
    else
        echo "missing	$token"
    fi
done > "${TMPDIR:-/tmp}/cask-migration.$$"

# 自動更新するかは Homebrew の cask 情報から取る
auto_updates=""
if [ -n "$brew_tokens" ] && command -v brew > /dev/null 2>&1; then
    auto_updates=$(HOMEBREW_NO_AUTO_UPDATE=1 brew info --json=v2 --cask $brew_tokens 2>/dev/null \
        | jq -r '.casks[] | select(.auto_updates) | .full_token')
fi

for token in $brew_tokens; do
    name=${token##*/}
    kind=$(jq -r '[.uninstall_artifacts[] | keys[0]] as $a
        | if ($a | index("app")) then "app"
          elif ($a | index("binary")) or ($a | index("font")) then "cli"
          else "other" end' "$caskroom/$name/.metadata/INSTALL_RECEIPT.json")
    if printf '%s\n' "$auto_updates" | grep -qx "$token"; then
        kind="$kind-auto"
    fi
    echo "$kind	$token"
done >> "${TMPDIR:-/tmp}/cask-migration.$$"

list() {
    awk -F '\t' -v k="$1" '$1 == k { print $2 }' "${TMPDIR:-/tmp}/cask-migration.$$" | sort
}
section() {
    items=$(for k in $2; do list "$k"; done | sort)
    [ -z "$items" ] && return
    echo "$1"
    printf '%s\n' "$items" | sed "s/^/  $3 /"
    echo
}

section "まだ Homebrew 管理: CLI・フォント（権限が関係ないので、すぐ移せる）" "cli" "☐"
section "まだ Homebrew 管理: アプリ（入れ直すと権限の許可し直しが必要なことがある）" "app other" "☐"
section "まだ Homebrew 管理: 自動更新するアプリ（アプリ自身が更新するので、移す優先度は低い）" "app-auto cli-auto other-auto" "☐"
section "mise 管理（移行済み）" "done" "☑"
section "未インストール（mise bootstrap packages apply で入る）" "missing" "-"

total=$(wc -l < "${TMPDIR:-/tmp}/cask-migration.$$" | tr -d ' ')
done_count=$(list done | grep -c . || true)
missing_count=$(list missing | grep -c . || true)
echo "移行済み: $done_count / $((total - missing_count))"
rm -f "${TMPDIR:-/tmp}/cask-migration.$$"
echo
echo "移し方: mise run cask-migration:migrate <名前>"
'''

[tasks."cask-migration:migrate"]
description = "Homebrew で入れた cask を入れ直して mise の管理に移す"
usage = '''
arg "<cask>" var=#true help="移す cask の名前（tap の cask は短い名前でもよい）"
flag "-y --yes" help="確認せずに実行する"
flag "-n --dry-run" help="実行するコマンドを表示するだけにする"
'''
run = '''
config="${MISE_GLOBAL_CONFIG_FILE:-$HOME/.config/mise/config.toml}"
caskroom=/opt/homebrew/Caskroom
configured=$(sed -nE 's/^"brew-cask:([^"]+)".*/\1/p' "$config")

# 設定にあって、まだ Homebrew 管理のものだけを対象にする
targets=""
for cask in $usage_cask; do
    token=$(printf '%s\n' "$configured" | awk -v c="$cask" '$0 == c || substr($0, length($0) - length(c)) == "/" c' | head -1)
    name=${token##*/}
    if [ -z "$token" ]; then
        echo "skip: $cask は $config の [bootstrap.packages] にありません" >&2
    elif [ -f "$caskroom/$name/.metadata/INSTALL_RECEIPT.json" ]; then
        case " $targets " in
            *" $token "*) ;;
            *) targets="$targets $token" ;;
        esac
    elif [ -d "$caskroom/$name" ]; then
        echo "skip: $token はすでに mise 管理です" >&2
    else
        echo "skip: $token はインストールされていません（mise bootstrap packages apply brew-cask:$token で入ります）" >&2
    fi
done
[ -z "$targets" ] && exit 1

echo "次のコマンドを実行します:"
for token in $targets; do
    echo "  brew uninstall --cask $token"
    echo "  mise bootstrap packages apply -y brew-cask:$token"
done
[ "${usage_dry_run:-}" = "true" ] && exit 0

if [ "${usage_yes:-}" != "true" ]; then
    printf "続けますか？ [y/N] "
    read -r answer < /dev/tty
    case "$answer" in
        y|Y|yes) ;;
        *) echo "中止しました"; exit 1 ;;
    esac
fi

for token in $targets; do
    echo
    echo "==> $token"
    brew uninstall --cask "$token"
    if ! mise bootstrap packages apply -y "brew-cask:$token"; then
        echo "mise でのインストールに失敗しました。元に戻すには: brew install --cask $token" >&2
        exit 1
    fi
done
echo
echo "完了しました。アプリの場合は、macOS の権限（アクセシビリティなど）を許可し直す必要がないか確認してください。"
'''

[tasks."packages:upgrade"]
description = "Homebrew のパッケージと mise のツールをまとめて更新する"
usage = '''
flag "-n --dry-run" help="更新されるものを表示するだけにする"
flag "-y --yes" help="mise bootstrap packages upgrade の確認を省略する"
'''
run = '''
dry_run=""
[ "${usage_dry_run:-}" = "true" ] && dry_run="--dry-run"
yes=""
[ "${usage_yes:-}" = "true" ] && yes="--yes"

echo "==> mise bootstrap packages upgrade"
mise bootstrap packages upgrade $dry_run $yes

# Homebrew で入れた cask は mise が更新しないので brew で更新する（自動更新するアプリは対象外）
if command -v brew > /dev/null 2>&1; then
    echo
    echo "==> brew upgrade --cask"
    brew upgrade --cask $dry_run
fi

echo
echo "==> mise up"
mise up $dry_run
'''

[tasks."packages:install"]
description = "Homebrew のパッケージを設定に追加してインストールする"
usage = '''
arg "<package>" var=#true help="インストールする formula の名前（--cask なら cask の名前）"
flag "--cask" help="cask としてインストールする"
flag "-n --dry-run" help="設定に書く内容とインストールするものを表示するだけにする"
flag "-y --yes" help="確認を省略する"
'''
run = '''
manager=brew
[ "${usage_cask:-}" = "true" ] && manager=brew-cask

packages=""
for package in $usage_package; do
    packages="$packages $manager:$package"
done

flags=""
[ "${usage_dry_run:-}" = "true" ] && flags="$flags --dry-run"
[ "${usage_yes:-}" = "true" ] && flags="$flags --yes"

# グローバル設定（dotfiles の mise/config.toml へのリンク）に書く
mise bootstrap packages use --global $flags $packages
'''

[tasks."packages:bootstrap"]
description = "設定にあるパッケージとツールのうち、未インストールのものをすべて入れる"
usage = '''
flag "-n --dry-run" help="インストールされるものを表示するだけにする"
flag "-y --yes" help="確認を省略する"
'''
run = '''
flags=""
[ "${usage_dry_run:-}" = "true" ] && flags="$flags --dry-run"
[ "${usage_yes:-}" = "true" ] && flags="$flags --yes"

echo "==> mise bootstrap packages apply"
mise bootstrap packages apply $flags

echo
echo "==> mise install"
mise install $flags
'''

[tasks."packages:uninstall"]
description = "Homebrew のパッケージをアンインストールして設定から削除する"
usage = '''
arg "<package>" var=#true help="アンインストールする formula の名前（--cask なら cask の名前）"
flag "--cask" help="cask としてアンインストールする"
flag "--force" help="mise が変更なしと確認できない cask（自動更新するアプリなど）も削除する"
flag "-n --dry-run" help="実行するコマンドを表示するだけにする"
flag "-y --yes" help="確認を省略する"
'''
run = '''
config="${MISE_GLOBAL_CONFIG_FILE:-$HOME/.config/mise/config.toml}"
manager=brew
[ "${usage_cask:-}" = "true" ] && manager=brew-cask
configured=$(sed -nE "s/^\"$manager:([^\"]+)\".*/\1/p" "$config")

# mise で入れた cask は brew では消せないので、設定から外してから prune で消す
brew_targets=""
mise_targets=""
config_only=""
for package in $usage_package; do
    token=$(printf '%s\n' "$configured" | awk -v p="$package" '$0 == p || substr($0, length($0) - length(p)) == "/" p' | head -1)
    declared=true
    [ -z "$token" ] && token=$package && declared=false
    name=${token##*/}
    if [ "$manager" = brew ] && [ -d "/opt/homebrew/Cellar/$name" ]; then
        brew_targets="$brew_targets $token"
    elif [ "$manager" = brew-cask ] && [ -f "/opt/homebrew/Caskroom/$name/.metadata/INSTALL_RECEIPT.json" ]; then
        brew_targets="$brew_targets $token"
    elif [ "$manager" = brew-cask ] && [ -d "/opt/homebrew/Caskroom/$name" ]; then
        if [ "$declared" = true ]; then
            mise_targets="$mise_targets $token"
        else
            echo "skip: $token は設定にないので、mise bootstrap packages prune --manager brew-cask で消してください" >&2
        fi
    elif [ "$declared" = true ]; then
        config_only="$config_only $token"
    else
        echo "skip: $manager:$token は設定になく、インストールもされていません" >&2
    fi
done
[ -z "$brew_targets$mise_targets$config_only" ] && exit 1

brew_flag=""
[ "$manager" = brew-cask ] && brew_flag="--cask "
prune_flags=""
[ "${usage_force:-}" = "true" ] && prune_flags="$prune_flags --force"
[ "${usage_yes:-}" = "true" ] && prune_flags="$prune_flags --yes"

echo "次のコマンドを実行し、$config から削除します:"
for token in $brew_targets; do
    echo "  brew uninstall $brew_flag$token"
done
[ -n "$mise_targets" ] && echo "  mise bootstrap packages prune --manager brew-cask$prune_flags  (対象:$mise_targets)"
[ -n "$config_only" ] && echo "  （インストールされていないので設定から削除するだけ:${config_only}）"
[ "${usage_dry_run:-}" = "true" ] && exit 0

if [ "${usage_yes:-}" != "true" ]; then
    printf "続けますか？ [y/N] "
    read -r answer < /dev/tty
    case "$answer" in
        y|Y|yes) ;;
        *) echo "中止しました"; exit 1 ;;
    esac
fi

# リンクを壊さないように、書き換えた内容をリンク先にそのまま書き戻す
remove_entry() {
    awk -v key="\"$manager:$1\"" '$1 != key' "$config" > "${TMPDIR:-/tmp}/packages-uninstall.$$"
    cat "${TMPDIR:-/tmp}/packages-uninstall.$$" > "$config"
    rm -f "${TMPDIR:-/tmp}/packages-uninstall.$$"
}

for token in $brew_targets; do
    echo
    echo "==> $token"
    brew uninstall $brew_flag"$token"
    remove_entry "$token"
done
for token in $config_only $mise_targets; do
    remove_entry "$token"
done
if [ -n "$mise_targets" ]; then
    echo
    echo "==> mise bootstrap packages prune --manager brew-cask"
    mise bootstrap packages prune --manager brew-cask $prune_flags
fi
'''

[tasks."packages:cleanup"]
description = "Homebrew の古いバージョンと、mise がダウンロードした cask・bottle を削除する"
usage = '''
flag "-n --dry-run" help="削除されるものを表示するだけにする"
flag "-y --yes" help="確認を省略する"
'''
run = '''
# mise はインストール後もダウンロードしたファイルを残し、cache prune は 30 日使われていないものしか消さない
cache="$(mise cache path)/system-brew"
downloads=""
for dir in casks bottles; do
    [ -d "$cache/$dir" ] && downloads="$downloads $cache/$dir"
done

echo "次の処理を実行します:"
echo "  brew cleanup（古いバージョンの formula と Homebrew のダウンロードキャッシュ）"
for dir in $downloads; do
    echo "  rm -rf ${dir}（$(du -sh "$dir" | cut -f1 | tr -d " ")）"
done

if [ "${usage_dry_run:-}" = "true" ]; then
    echo
    echo "==> brew cleanup --dry-run"
    brew cleanup --dry-run
    exit 0
fi

if [ "${usage_yes:-}" != "true" ]; then
    printf "続けますか？ [y/N] "
    read -r answer < /dev/tty
    case "$answer" in
        y|Y|yes) ;;
        *) echo "中止しました"; exit 1 ;;
    esac
fi

echo
echo "==> brew cleanup"
brew cleanup
for dir in $downloads; do
    rm -rf "$dir"
done
echo
echo "mise のダウンロードを削除しました"
'''

[tasks."packages:status"]
description = "設定にあるパッケージとツールの、インストール状況とバージョンを表示する"
run = '''
echo "==> Homebrew パッケージ（mise bootstrap packages status）"
mise bootstrap packages status

echo
echo "==> mise のツール（mise ls --current）"
mise ls --current
'''

[tasks."packages:outdated"]
description = "packages:upgrade で更新されるものだけを表示する"
run = '''
# upgrade の dry-run から「更新なし」の行を除いて、実際に更新されるものだけを残す
echo "==> Homebrew パッケージ（mise bootstrap packages upgrade --dry-run）"
packages=$(mise bootstrap packages upgrade --dry-run 2>&1 \
    | grep -v -E '^mise WARN|already up to date|already poured|skipped:|leaving unchanged|^link |^install pkg ' || true)
if [ -n "$packages" ]; then
    printf '%s\n' "$packages"
else
    echo "すべて最新です"
fi

# Homebrew で入れた cask は mise が更新しないので、brew で確認する
if command -v brew > /dev/null 2>&1; then
    echo
    echo "==> Homebrew で入れた cask（brew outdated --cask）"
    casks=$(brew outdated --cask --verbose)
    if [ -n "$casks" ]; then
        printf '%s\n' "$casks"
    else
        echo "すべて最新です"
    fi
fi

echo
echo "==> mise のツール（mise outdated）"
mise outdated
'''
